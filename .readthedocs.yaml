# NOTE: the published site does not use this file. Read the Docs builds
# the docs-html branch, which .github/workflows/docs-publish.yml fills with
# HTML built on GitHub from main (Read the Docs' free machines can't build
# these docs inside their 15-minute limit). This file is kept so a full
# Read the Docs build can still be run, e.g. for a pull-request preview.
# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "20"
    # rust: "1.70"
    # golang: "1.20"
  jobs:
    # Build matplotlib's font cache before sphinx runs. On a fresh build
    # machine the first import prints "Matplotlib is building the font
    # cache" to stderr, and with fail_on_warning that one line fails the
    # whole build.
    post_install:
      - python -c "import matplotlib.pyplot"
    # Read the Docs stops a free project's build at 15 minutes, and the
    # pages execute their code as they build (about 12 minutes in series).
    # Build them in parallel (every extension here is parallel-read safe).
    # Same command Read the Docs runs by default, plus -j auto.
    build:
      html:
        - python -m sphinx -T -W --keep-going -j auto -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # You can configure Sphinx to use a different builder, for instance use the dirhtml builder for simpler URLs
  # builder: "dirhtml"
  # Fail on all warnings to avoid broken references. The CI docs job
  # passes -W for the same reason; the two need to agree, or one of them
  # goes green while the other publishes a broken page.
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#   - pdf
#   - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs