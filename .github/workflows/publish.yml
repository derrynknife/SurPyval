name: Publish to PyPI

# Publishes a release to PyPI, in either of two ways.
#
# 1. Push a version tag (e.g. v0.24) to the merge of the release pull request
#    into ``main``.
#
# 2. Run this workflow by hand on ``main`` (Actions -> Publish to PyPI ->
#    Run workflow; ``gh workflow run publish.yml --ref main -f
#    version=0.25``; or the REST API). It checks the version typed in against
#    pyproject.toml, that the tag v<version> does not exist yet and that PyPI
#    does not have the version. After publishing it creates the tag
#    v<version> on that commit and a GitHub Release, so no one needs to push
#    a tag. ``dry_run`` does the checks and the build only. A tag created by
#    this workflow starts no second run: GitHub starts no workflow for events
#    made with a workflow's own token, so nothing is published twice.
#
# Either way, publishing runs no tests. The one automated test is the run on
# the release pull request into ``main`` (actions.yml); publishing checks it:
# the commit must be the merge of a pull request into ``main`` every job of
# whose run passed on the code released -- at its head, or at an earlier
# head whose tree differs from it only in .github/ -- or nothing is
# published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) -- no API token is stored
# in the repository. The trusted publisher is configured on PyPI for the
# ``surpyval`` project (workflow ``publish.yml``, environment ``pypi``), so
# keep this file's name.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, MAJOR.MINOR as in pyproject.toml (e.g. 0.25)"
        required: true
        type: string
      dry_run:
        description: "Only check and build: publish nothing, create no tag or release"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    # Each job takes a minute or two; a limit makes one that hangs (a
    # stalled upload, say) fail rather than run for GitHub's six hours.
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # (the earlier heads of the release pull request, to compare)
          fetch-depth: 0

      # A run by hand: it releases the head of main, as a version that
      # has neither a tag nor a PyPI release yet.
      - name: Check the run by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REQUESTED' isn't MAJOR.MINOR (e.g. 0.25)."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED" > /dev/null; then
            echo "::error::The tag v$REQUESTED already exists."
            exit 1
          fi
          pypi=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/surpyval/$REQUESTED/json")
          if [ "$pypi" = 200 ]; then
            echo "::error::surpyval $REQUESTED is already on PyPI."
            exit 1
          fi

      # The commit is the merge of the release pull request. Every job of
      # the release run must have passed on the code being released: for
      # each job of the latest run at the pull request's head, its most
      # recent result (a success or a failure; a cancelled or skipped
      # attempt is no result) on the pull request, from a run at the head
      # or at an earlier head whose tree is identical to the head's
      # outside .github/ (CI configuration: workflows and the calibration
      # grouping), must be a success. A job new or renamed at the head can
      # only have passed at the head. Each job's evidence is logged.
      - name: Check the release pull request's jobs passed on this code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)]
                  | .[0].number // empty')
          # GitHub doesn't always link a merge commit back to its pull
          # request (it didn't for 0.27's): find it by its merge commit.
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=50" \
              --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\" and .merged_at != null)]
                    | .[0].number // empty")
          fi
          if [ -z "$PR" ]; then
            echo "$GITHUB_SHA is not the merge of a pull request into main" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '[.head.sha, .head.ref, .created_at] | @tsv' > pr.tsv
          read -r HEAD REF CREATED < pr.tsv
          # The release pull request's runs of actions.yml since it opened
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/actions.yml/runs?event=pull_request&branch=$REF&per_page=100" \
            --jq ".workflow_runs[] | select(.created_at >= \"$CREATED\")
                  | [.id, .head_sha] | @tsv" > runs.tsv
          : > jobs.tsv
          while read -r RUN SHA; do
            git cat-file -e "$SHA^{commit}" 2>/dev/null || continue
            if [ "$SHA" = "$HEAD" ]; then
              same=head
            elif git diff --quiet "$SHA" "$HEAD" -- . ':(exclude).github'; then
              same=same
            else
              continue
            fi
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=all&per_page=100" \
              --jq ".jobs[] | [.name, .status, (.conclusion // \"\"),
                     (.completed_at // \"\"), \"$RUN\", (.run_attempt|tostring),
                     \"$SHA\", \"$same\"] | @tsv" >> jobs.tsv
          done < runs.tsv
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/actions.yml/runs?event=pull_request&head_sha=$HEAD&per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at] | @tsv' \
            | sort -k2 | tail -1 | cut -f1 > latest_run.txt
          python - "$PR" "$(cat latest_run.txt)" <<'PY'
          import sys

          pr, latest_run = sys.argv[1], sys.argv[2]
          rows = [line.rstrip("\n").split("\t") for line in open("jobs.tsv")]
          required = sorted({r[0] for r in rows if r[4] == latest_run})
          if not required:
              sys.exit(f"pull request #{pr} has no run at its head")
          if not any(n.startswith("surpyval_ci") for n in required):
              sys.exit(f"pull request #{pr} has no test-suite run")
          bad = []
          for name in required:
              results = [r for r in rows if r[0] == name
                         and r[1] == "completed" and r[2] in ("success", "failure")]
              if not results:
                  bad.append(f"{name}: no result on this code")
                  continue
              last = max(results, key=lambda r: r[3])
              where = "the head" if last[7] == "head" else f"{last[6][:8]} (same code)"
              print(f"{last[2]:8} {name} -- run {last[4]} attempt {last[5]} at {where}")
              if last[2] != "success":
                  bad.append(f"{name}: {last[2]}")
          if bad:
              sys.exit(f"pull request #{pr}: not every job passed on this code: {bad}")
          print(f"pull request #{pr}: {len(required)} jobs passed on this code")
          PY

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tag pushed, or the version typed in, must be pyproject.toml's.
      - name: Check the version matches the package
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          WANT="${REQUESTED:-${GITHUB_REF_NAME#v}}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$WANT" != "$PKG" ]; then
            echo "Version $WANT does not match pyproject version $PKG" >&2
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/surpyval
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag and GitHub Release
    needs: [build, publish]
    # Only for a run by hand, and only once PyPI has the version, so a
    # failed publish leaves no tag.
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="v$VERSION" \
            -F generate_release_notes=true \
            --jq '.html_url'
