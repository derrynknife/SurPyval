name: actions

run-name: SurPyval CI

# One automated run: the full check, on a pull request into `master` (the
# release). Nothing runs on pull requests into `develop` or on pushes to any
# branch. The run tests the pull request's merge result, so a failure is
# found, and fixed on `develop`, before `master` changes; merge the release
# only when it is green. See docs/Contributing.rst for the branching /
# release flow.
#
# Every job below runs in that one run: lint, the conformance suite, the
# test suite on three interpreters (each split into four parts that run at
# once) with the docstring examples, the calibration studies and scenario
# cards (in groups that run at once), the wheel check and the documentation
# build. Publishing a release
# (publish.yml) checks that this run passed.
on:
  pull_request:
    branches: [master]

env:
  SRC: surpyval # Source directory to run jobs on
  # What the style checks cover: the package, the root conftest and the
  # maintenance scripts. (mypy checks the package; the others are not
  # annotated.)
  LINT: surpyval conftest.py scripts

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: flake8
        run: flake8 $LINT

      - name: isort
        run: isort --check-only $LINT

      - name: mypy
        run: mypy $SRC

      - name: black
        run: black --check $LINT

  # The conformance suite runs with the rest of the tests, on the pull
  # request into `master`.
  #
  # It runs every public model, listed once in a registry
  # (surpyval/tests/conformance/registry.py), through one battery of
  # general properties: the identities between sf, ff, Hf, hf, df and qf;
  # scalar, 2-D and empty queries; query order and covariate rows; units,
  # data-row order and counts; valid values; the missing-value rule; seeds;
  # and the serialisation round trip. Every documentation sweep found bugs
  # that were an old kind of failure in a model nobody had checked for it
  # -- unsorted input, units, row routing, missing values -- and each fix
  # tested only its own case (#379). This is the check that makes the next
  # change meet the same properties.
  #
  # It takes about forty seconds on one core: the fixtures are tiny, and
  # the refits of the less common variants (the other regression baselines
  # and life models, the offset / LFP / zero-inflated forms beyond
  # Weibull) are marked ``slow`` and left out here. The full suite, in the
  # same run, runs them too. A known failure is a
  # strict xfail, so this stays green, and turns red the day the failure
  # is fixed, as a reminder to remove its entry.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: pytest (conformance)
        run:
          python -m pytest surpyval/tests/conformance -m "not slow"

  # The test suite runs on the pull request into `master` -- the release --
  # and on nothing else (see the top of this file).
  #
  # Each interpreter's run is split into four parts that run at once
  # (``--shard K/4``, in the root conftest.py: a test belongs to the part
  # its id hashes to), so the suite takes about a quarter of the time it
  # takes in one job. The parts together run every test.
  #
  # 3.12 also measures coverage, which the ``coverage`` job combines
  # across its four parts. The doctests run in part 1 of each interpreter.
  # The calibration studies and scenario cards run in the ``calibration``
  # job below.
  surpyval_ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: pytest
        # Run across all available cores: the suite is dominated by a
        # handful of Monte Carlo and bootstrap tests, so it parallelises
        # well. Coverage comes from pytest-cov rather than `coverage run`,
        # because the latter does not follow the xdist worker
        # subprocesses. Invoked as ``python -m`` so the plugins resolve
        # against the interpreter the dependencies were installed into.
        #
        # ``--run-ml`` opts the beta survival tree and forest tests back
        # in. They are skipped by default because they are about half of
        # a local run, but a release still tests them.
        #
        # Coverage uses the ``sysmon`` core (3.12's ``sys.monitoring``),
        # which costs far less than the C tracer; it measures lines only,
        # which is all the coverage here measures (no ``branch``).
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          ONLY_312: >-
            ${{ matrix.python-version == '3.12'
            && '--cov=surpyval --cov-report=' || '' }}
        run: >-
          python -m pytest -n auto --run-ml
          --shard=${{ matrix.shard }}/4 $ONLY_312

      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true

      # Execute the ``>>>`` examples in the docstrings and compare their
      # printed output. This is what a user (or an agent) sees from
      # ``help(Weibull.fit)``, so it is a documented promise like any
      # other, and it went stale silently until it was checked. Kept as
      # its own step -- separate from the suite above -- so a failure
      # reads as "the docs drifted", not "a test broke", and so the
      # doctest collection does not disturb coverage or xdist. It runs in
      # part 1 of each interpreter (it is not split).
      #
      # ``surpyval/tests`` is excluded because the test modules have no
      # user-facing examples.
      # Option flags are set in pyproject.toml; conftest.py adds the
      # numeric comparison that lets the examples record real output.
      - name: doctests
        if: matrix.shard == 1
        run:
          python -m pytest --doctest-modules surpyval
          --ignore=surpyval/tests

      # The numeric comparison above only runs for an example whose
      # output has actually drifted -- a handful on any one machine, and
      # a different handful on each. That leaves a gap in it invisible
      # until CI hits the one example that needed it. This second pass
      # routes every example through it, so the fallback is checked
      # against all of them. Fifteen seconds.
      - name: doctests (numeric comparison forced)
        if: matrix.shard == 1
        run:
          python -m pytest --doctest-modules surpyval
          --ignore=surpyval/tests
          --doctest-force-numeric

  # The statistical calibration studies (--run-calibration) and the
  # practitioner scenario cards (--run-scenarios), on 3.12, in groups that
  # run at once. A calibration study is one long Monte Carlo test, so the
  # hash split above cannot spread them: the groups are chosen by the
  # studies' measured times on these runners (the 9 October 2026 timings,
  # in seconds on one core: #617's bootstrap 3217, the likelihood-ratio
  # coverage of LogNormal 659 and Weibull 622, #583 522, the Beta4 refit
  # 446, the two-stage degradation band 427, every other study under 230),
  # so that none takes much over a quarter of an hour. #617's study runs
  # its repetitions on every core itself (workers 0: no xdist). A new
  # calibration study lands in the "rest" group, or in "copula" or
  # "refit" by its file; move it out if it is long.
  calibration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 617-bootstrap
            workers: '0'
            args: >-
              'surpyval/tests/calibration/test_coverage_regression.py::test_617_cb_bootstrap_coverage_at_an_extrapolated_use_condition'
          - group: likelihood-ratio
            workers: '2'
            args: >-
              'surpyval/tests/calibration/test_coverage_parametric.py::test_likelihood_ratio_coverage'
          - group: long-studies
            workers: '3'
            args: >-
              'surpyval/tests/calibration/test_coverage_regression.py::test_583_cb_coverage_at_an_extrapolated_use_condition'
              'surpyval/tests/calibration/test_refit_registry.py::test_refit[Beta4]'
              'surpyval/tests/calibration/test_coverage_degradation.py::test_two_stage_band_coverage'
          - group: copula
            workers: auto
            args: surpyval/tests/calibration/test_coverage_copula.py
          - group: refit
            workers: auto
            args: >-
              surpyval/tests/calibration/test_refit_registry.py
              --deselect 'surpyval/tests/calibration/test_refit_registry.py::test_refit[Beta4]'
          - group: rest
            workers: auto
            args: >-
              surpyval/tests/calibration surpyval/tests/scenarios
              --ignore=surpyval/tests/calibration/test_coverage_copula.py
              --ignore=surpyval/tests/calibration/test_refit_registry.py
              --deselect 'surpyval/tests/calibration/test_coverage_regression.py::test_617_cb_bootstrap_coverage_at_an_extrapolated_use_condition'
              --deselect 'surpyval/tests/calibration/test_coverage_regression.py::test_583_cb_coverage_at_an_extrapolated_use_condition'
              --deselect 'surpyval/tests/calibration/test_coverage_parametric.py::test_likelihood_ratio_coverage'
              --deselect 'surpyval/tests/calibration/test_coverage_degradation.py::test_two_stage_band_coverage'
          # Tests outside surpyval/tests/calibration that carry the
          # calibration mark: the likelihood-ratio sweeps of the slow
          # conformance families (Bound.nightly in the registry).
          - group: conformance-sweeps
            workers: auto
            args: surpyval/tests/conformance -m calibration
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: pytest (${{ matrix.group }})
        run: >-
          python -m pytest -rP --durations=10 -n ${{ matrix.workers }}
          --run-calibration --run-scenarios ${{ matrix.args }}

  # The 3.12 parts' coverage, combined into one report.
  coverage:
    needs: surpyval_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: coverage
        run: |
          coverage combine
          coverage report
          coverage html

      - name: Upload coverage html report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/

  # The suite as installed from the built wheel, collected (not run) in a
  # clean environment with only pytest beside the package's own
  # dependencies, on the pull request into `master`. The repository run above
  # sees files the wheel does not carry: 0.23 shipped tests that read
  # reference data and a root-conftest helper left out of it, and the
  # installed suite could not be collected (#661). Collection is what
  # breaks that way, and takes about a minute.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install it in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest

      - name: Collect the installed suite
        # Outside the checkout, so the package imported is the installed
        # one and the repository's conftest is not seen
        working-directory: /tmp
        run: /tmp/clean/bin/python -m pytest --pyargs surpyval --collect-only -q

  # Build the documentation on the pull request into `master`, with the test
  # suite.
  #
  # The docs execute every ``.. jupyter-execute::`` cell during the
  # build, so they are a second test suite that runs the public API for
  # real -- and one that can be broken by a change that touches no
  # documentation file at all. Removing Gamma's probability-plot fitting
  # did exactly that: a cell looping over the fit methods started
  # raising. Read the Docs builds ``master`` and tags too, but with no
  # check on the result; this run is what fails visibly.
  #
  # The point is to reproduce the hosted build, so this matches
  # .readthedocs.yaml rather than the test jobs above: Python 3.12, and
  # the package installed with its own ``docs`` extra.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      # -W turns warnings into errors. A sphinx warning is not a style
      # nag: a broken cross-reference renders as plain text, a bad
      # autodoc path drops the whole class from the page, a page missing
      # from every toctree is published but unreachable. The build
      # "succeeds" and ships something wrong, and the only signal is a
      # line in a log nobody reads -- which is exactly how three broken
      # autodoc targets went unnoticed until the API pages were written.
      #
      # This only works from a zero baseline, which the commits above
      # established. --keep-going reports every warning rather than
      # stopping at the first, so a bad build is fixed in one pass.
      #
      # .readthedocs.yaml sets fail_on_warning for the same reason. The
      # two must move together, or CI passes while the hosted build
      # fails.
      - name: sphinx build
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
