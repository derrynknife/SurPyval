name: actions

run-name: SurPyval CI

# Run CI on pull requests into the integration branches and on pushes to
# master (i.e. release merges + tags). Feature work accumulates on `develop`
# via PRs; day-to-day pushes to feature branches no longer each trigger the
# full suite. See docs/Contributing.rst for the branching / release flow.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

env:
  SRC: surpyval # Source directory to run jobs on

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: flake8
        run: flake8 $SRC

      - name: mypy
        run: mypy $SRC

      - name: black
        run: black --check $SRC

  surpyval_ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: pytest
        # The alpha-stage modules are not part of the release contract
        # and are excluded from the deployment test run. (Beta-stage
        # tests, e.g. the survival forest's, do run.)
        #
        # Run across all available cores: the suite is dominated by a
        # handful of Monte Carlo and bootstrap tests, so it parallelises
        # well -- 13m21 to 4m10 on four cores locally. Coverage comes
        # from pytest-cov rather than `coverage run`, because the latter
        # does not follow the xdist worker subprocesses; the totals are
        # identical either way. The report and html steps below still
        # read the .coverage file it writes.
        # Invoked as ``python -m`` so the plugins resolve against the
        # interpreter the dependencies were installed into, rather than
        # whichever ``pytest`` happens to be first on PATH.
        #
        # ``--run-ml`` opts the beta survival tree and forest tests back
        # in. They are skipped by default because they are 97 of the
        # suite's 180 seconds locally, but deployment still tests them.
        run:
          python -m pytest -n auto --cov=surpyval --cov-report=
          --ignore=surpyval/tests/alpha --run-ml

      # Execute the ``>>>`` examples in the docstrings and compare their
      # printed output. This is what a user (or an agent) sees from
      # ``help(Weibull.fit)``, so it is a documented promise like any
      # other, and it went stale silently until it was checked. Kept as
      # its own step -- separate from the suite above -- so a failure
      # reads as "the docs drifted", not "a test broke", and so the
      # doctest collection does not disturb coverage or xdist.
      #
      # ``surpyval/tests`` is excluded because the test modules have no
      # user-facing examples, and ``surpyval/alpha`` because it is not
      # part of the release contract (same reason the suite skips it).
      # Option flags are set in pyproject.toml; conftest.py adds the
      # numeric comparison that lets the examples record real output.
      - name: doctests
        run:
          python -m pytest --doctest-modules surpyval
          --ignore=surpyval/tests --ignore=surpyval/alpha

      - name: coverage
        run: |
          coverage report
          coverage html

      - name: Upload coverage html report artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
