name: actions

run-name: SurPyval CI

# One automated run: the full check, on the pull request from `dev` into
# `main` (the release). Nothing runs on pull requests into `dev` or on
# pushes to any branch. The run tests the pull request's merge result, so
# a failure is found, and fixed on `dev`, before `main` changes; merge the
# release only when it is green. See docs/Contributing.rst for the
# branching / release flow.
#
# Every job below runs in that one run: lint, the conformance suite, the
# test suite on three interpreters (each split into four parts that run at
# once) with the docstring examples, the calibration studies and scenario
# cards (in groups that run at once), the PyMC helpers with PyMC installed,
# the wheel check and the documentation build. Publishing a release
# (publish.yml) checks that this run passed.
on:
  pull_request:
    branches: [main]

# A newer push to the pull request (each update to `dev`) cancels its
# older, out-of-date run, so only the latest `dev` is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SRC: surpyval # Source directory to run jobs on
  # What the style checks cover: the package, the root conftest and the
  # maintenance scripts. (mypy checks the package; the others are not
  # annotated.)
  LINT: surpyval conftest.py scripts

jobs:
  # TEMPORARY CI check (not for merging)
  calibration:
    runs-on: ubuntu-latest
    # Every group took under 40 minutes on the 17 October 2026 runs (the
    # longest, #617's bootstrap, 24 to 36; the runners' speed varies by
    # about two); one that hangs fails here rather than holding the
    # release for GitHub's six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: joint-distributional
            workers: auto
            args: >-
              surpyval/tests/calibration/test_coverage_joint.py
              surpyval/tests/calibration/test_coverage_distributional.py
          - group: rest
            workers: auto
            args: >-
              surpyval/tests/calibration surpyval/tests/scenarios
              --ignore surpyval/tests/calibration/test_sbc_bayes.py
              --ignore=surpyval/tests/calibration/test_coverage_joint.py
              --ignore=surpyval/tests/calibration/test_coverage_distributional.py
              --ignore=surpyval/tests/calibration/test_coverage_copula.py
              --ignore=surpyval/tests/calibration/test_refit_registry.py
              --ignore=surpyval/tests/calibration/test_coverage_extra_parameters.py
              --deselect 'surpyval/tests/calibration/test_coverage_regression.py::test_617_cb_bootstrap_coverage_at_an_extrapolated_use_condition'
              --deselect 'surpyval/tests/calibration/test_coverage_regression.py::test_583_cb_coverage_at_an_extrapolated_use_condition'
              --deselect 'surpyval/tests/calibration/test_coverage_parametric.py::test_likelihood_ratio_coverage'
              --deselect 'surpyval/tests/calibration/test_coverage_degradation.py::test_two_stage_band_coverage'
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      # A per-test limit (pytest-timeout) under the job's: a study that
      # hangs or runs far over fails with its name and every thread's
      # stack, where the job's limit only cancelled the run part way
      # (the "rest" group at 53% on 30 October 2026). 45 minutes is over
      # the longest study's time (#617's bootstrap, 24 to 36), so it stops
      # no sound study; a hang that starts later is still stopped by the
      # job's limit.
      - name: pytest (${{ matrix.group }})
        run: >-
          python -m pytest -rP --durations=10 -n ${{ matrix.workers }}
          --timeout=2700 --timeout-method=thread
          --run-calibration --run-scenarios ${{ matrix.args }}

