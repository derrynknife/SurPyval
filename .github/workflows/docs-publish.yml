name: Publish docs

# Read the Docs' free build machines stop a build at 15 minutes, and these
# docs run their examples as they build (about 7 minutes here, well over 15
# there). So the docs are built here and Read the Docs only publishes them:
#
#   push to main -> this job builds the HTML (the same sphinx build as the
#   CI docs job, warnings as errors) -> force-pushes it, with a small
#   .readthedocs.yaml that just copies it, to the docs-html branch ->
#   Read the Docs, whose default branch is docs-html, publishes it in seconds.
#
# Run it by hand (workflow_dispatch) to republish without a push.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"
          # Build matplotlib's font cache now: its first-import notice on
          # stderr would otherwise fail the -W build.
          python -c "import matplotlib.pyplot"

      - name: sphinx build
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Push the HTML to the docs-html branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          out="$(mktemp -d)"
          mkdir "$out/html"
          cp -r docs/_build/html/. "$out/html/"
          rm -rf "$out/html/.doctrees"
          cat > "$out/.readthedocs.yaml" <<'YAML'
          # Written by .github/workflows/docs-publish.yml on main. The HTML
          # is already built; Read the Docs only copies it.
          version: 2
          build:
            os: ubuntu-22.04
            tools:
              python: "3.12"
            commands:
              - mkdir -p $READTHEDOCS_OUTPUT
              - cp -r html $READTHEDOCS_OUTPUT/html
          YAML
          cat > "$out/README.md" <<EOF2
          Built documentation only, published by Read the Docs. Generated
          from main at ${SOURCE_SHA} by .github/workflows/docs-publish.yml;
          every run replaces this branch. Don't edit it by hand.
          EOF2
          cd "$out"
          git init -q -b docs-html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Docs built from main at ${SOURCE_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-html
