[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surpyval"
version = "0.19.0"
description = "A python package for survival analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Derryn Knife", email = "derryn@reliafy.com"},
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "autograd>=1.8",
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "formulaic>=1.2",
    "numdifftools>=0.9.42",
    "joblib",
]

[project.optional-dependencies]
tests = [
    "pytest>=9",
    "scikit-survival",
    # BSON round-trip tests for the serialised-model dictionaries
    # (MongoDB compatibility); pymongo provides the bson package.
    "pymongo>=4",
]
docs = [
    # The documentation build toolchain, used by Read the Docs and by a
    # local ``sphinx-build``. Fully pinned rather than bounded: the docs
    # execute every ``.. jupyter-execute::`` cell during the build, so a
    # toolchain change can break the build in ways a version range would
    # let through silently. Bump these together and re-validate with a
    # complete build:
    #
    #     pip install -e ".[docs]"
    #     python -m sphinx -b html docs docs/_build/html
    #
    # matplotlib is not repeated here -- it is a runtime dependency of
    # the package itself, which the docs install alongside these.
    "sphinx==8.2.3",
    "sphinx_rtd_theme==3.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-notfound-page==1.1.0",
    "jupyter-sphinx==0.5.3",
    # Capped below 7: jupyter-sphinx notebook execution hangs or dies
    # with a zmq "Socket operation on non-socket" against the ipykernel
    # 7 line.
    "ipykernel==6.31.0",
]

[project.urls]
Homepage = "https://github.com/derrynknife/SurPyval"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["datasets/*.csv", "py.typed"]

# pytest
[tool.pytest.ini_options]
# Applied to the ``--doctest-modules`` run (see .github/workflows/actions.yml),
# which executes the ``>>>`` examples in the docstrings and compares their
# printed output.
#
# numpy chooses its own line breaks and column padding when it reprs an
# array, and both change with the width of the widest element. Without
# this an example is only correct for the exact terminal wrapping it was
# captured at, and a docstring wrapped to 79 columns by hand -- as most
# of these are -- can never match.
#
# The other half of the comparison is in conftest.py, which compares the
# numbers in the output as numbers rather than as text.
doctest_optionflags = "NORMALIZE_WHITESPACE"

# For Black pre-commit hook
[tool.black]
line-length = 79

# So isort is compatible with black
[tool.isort]
profile = "black"
line_length = 79
skip = ["__init__.py"]

# mypy
[tool.mypy]

# Modules whose every function is annotated. Listing one here makes an
# unannotated function in it an error, so the coverage cannot slip back
# -- a ratchet rather than a target (#143).
#
# The package ships py.typed, which tells a user's type checker that
# these annotations are there to be trusted. Without this setting mypy
# only checks the annotations that happen to exist, so nothing stopped
# that promise from being half true.
#
# Add a module here once `mypy <module> --disallow-untyped-defs` is
# clean. Do not add one with a `# type: ignore` to make it pass; the
# point is the annotations, not the green tick.
[[tool.mypy.overrides]]
module = [
    'surpyval.distribution',
    'surpyval.serialisation',
    'surpyval.metrics.*',
    'surpyval.univariate.information_criteria',
    'surpyval.univariate.nonparametric.*',
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    'scipy.*',
    'autograd.*',
    'pandas',
    'formulaic',
    'matplotlib.*',

    'sphinx_rtd_theme',
    'sklearn.*',
    'sksurv.*',
    'joblib.*',
]
ignore_missing_imports = true

# Coverage
[tool.coverage.run]
source = ["surpyval"]

# Flake8
[tool.flake8]
ignore = ['E203', 'W503', 'E704', 'E741']
per-file-ignores = [
    '*/__init__.py:F401',
]
